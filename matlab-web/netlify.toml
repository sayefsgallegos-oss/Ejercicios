# Configuración de Netlify
# En Netlify: Site configuration > Build & deploy > Base directory = matlab-web
# (no hay "build command": es HTML puro). Publish directory = matlab-web

[build]
  publish = "."

# Direcciones antiguas o sin barra final -> la página correcta
[[redirects]]
  from = "/nosotros"
  to = "/nosotros/"
  status = 301

[[redirects]]
  from = "/registro-de-notas-matlab"
  to = "/registro-de-notas-matlab/"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# Cabeceras de seguridad y caché
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# CSS y JS: se revalidan siempre para que tus cambios se vean al instante
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
